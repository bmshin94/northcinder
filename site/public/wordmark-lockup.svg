<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" role="img" aria-label="northcinder logo lockup">
  <title>northcinder — mark + wordmark lockup</title>
  <defs>
    <path id="northcinder-mark-path-word"
          d="M18,72 L18,50 L42,50 L47,65 L83,19"
          fill="none"
          stroke="#1F7A5C"
          stroke-width="15"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </defs>

  <!-- cell 1: mark-only lockup -->
  <g transform="translate(4,0) scale(0.62)">
    <use href="#northcinder-mark-path-word" />
  </g>

  <!-- cell 2: mark + wordmark lockup -->
  <g transform="translate(180,0) scale(0.62)">
    <use href="#northcinder-mark-path-word" />
  </g>
  <text x="240" y="63"
        font-family="ui-sans-serif, -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="46"
        font-weight="600"
        letter-spacing="-0.5"
        fill="#1A1A17">northcinder</text>
</svg>
