name: Feature proposal
description: Propose a focused change to NorthCinder
title: "proposal: "
body:
  - type: markdown
    attributes:
      value: |
        Use Discussions for open-ended ideas. Use this form when the problem and proposed outcome are specific enough to evaluate as work.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and who encounters the problem?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than an implementation preference.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives

  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Product or seller evidence
        - Ranking or three-candidate decision brief
        - Store adapter
        - Exact-purchase approval or checkout
        - Client, dashboard, outcomes, or audit trail
        - Preferences, watches, orders, or reminders
        - Packaging, setup, or documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contract
    attributes:
      label: Product contract
      options:
        - label: This proposal keeps seller payment out of ranking.
          required: true
        - label: This proposal preserves separate human approval for one exact purchase.
          required: true
        - label: This proposal treats host, page, model, and provider content as untrusted data.
          required: true
        - label: This proposal does not introduce raw card handling, undisclosed telemetry, or a NorthCinder-operated service.
          required: true
